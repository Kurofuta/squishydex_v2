<svg viewBox="0 0 64 64" width="60" height="60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradé liquide améthyste / magenta -->
    <linearGradient id="pam_liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5D0FE"/>
      <stop offset="25%" stop-color="#E879F9"/>
      <stop offset="65%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
    <!-- Verre à facettes -->
    <linearGradient id="pam_glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#E9D5FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7E22CE" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Argent / Métal raffiné -->
    <linearGradient id="pam_silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <!-- Bouchon gemme taillée -->
    <linearGradient id="pam_gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4FF"/>
      <stop offset="40%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
  </defs>

  <!-- Ombre au sol -->
  <ellipse cx="32" cy="56" rx="20" ry="4.5" fill="#fbcfe8" opacity="0.9"/>

  <!-- Halo magique diffus -->
  <circle cx="32" cy="38" r="18" fill="#E879F9" opacity="0.22"/>

  <!-- Flacon taillé en cristal (forme hexagonale facettée) -->
  <!-- Fond du flacon -->
  <path d="M 26 17 L 38 17 L 38 23 L 48 31 L 44 51 L 20 51 L 16 31 L 26 23 Z" fill="url(#pam_glass)" stroke="#7E22CE" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Liquide intérieur -->
  <path d="M 17.5 32 L 20.5 50 L 43.5 50 L 46.5 32 C 43 30 38 34 32 32 C 26 30 21 34 17.5 32 Z" fill="url(#pam_liquid)"/>

  <!-- Vague et brillance de surface -->
  <path d="M 17.5 32 C 21 34 26 30 32 32 C 38 34 43 30 46.5 32" stroke="#FDF4FF" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Facettes intérieures du verre (effet cristal taillé) -->
  <line x1="26" y1="23" x2="24" y2="50" stroke="#FFFFFF" stroke-width="0.8" opacity="0.5"/>
  <line x1="38" y1="23" x2="40" y2="50" stroke="#7E22CE" stroke-width="0.8" opacity="0.4"/>
  <line x1="32" y1="23" x2="32" y2="50" stroke="#FFFFFF" stroke-width="0.6" opacity="0.3"/>

  <!-- Bulles d'énergie qui montent -->
  <circle cx="27" cy="45" r="1.8" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="37" cy="41" r="2.2" fill="#FDF4FF" opacity="0.7"/>
  <circle cx="33" cy="36" r="1.2" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="23" cy="38" r="1" fill="#FFFFFF" opacity="0.75"/>

  <!-- Reflets tranchants sur les arêtes -->
  <path d="M 17 31 L 21 50" stroke="#FFFFFF" stroke-width="1.3" opacity="0.8" stroke-linecap="round"/>
  <polygon points="26,24 28,24 25,36 23,36" fill="#FFFFFF" opacity="0.6"/>

  <!-- Bague en argent ciselé au goulot -->
  <rect x="24" y="19" width="16" height="4" rx="1.2" fill="url(#pam_silver)" stroke="#475569" stroke-width="0.8"/>
  <!-- Pendentif étoile en argent suspendu -->
  <path d="M 32 23 L 32 27" stroke="#94A3B8" stroke-width="1"/>
  <path d="M 32 27 L 33 29 L 35 29.5 L 33.5 31 L 34 33 L 32 32 L 30 33 L 30.5 31 L 29 29.5 L 31 29 Z" fill="url(#pam_silver)" stroke="#475569" stroke-width="0.4"/>

  <!-- Bouchon en améthyste précieuse taillée en losange -->
  <polygon points="32,6 38,13 38,19 26,19 26,13" fill="url(#pam_gem)" stroke="#4C1D95" stroke-width="0.9" stroke-linejoin="round"/>
  <!-- Facettes de la gemme -->
  <polygon points="32,6 35,13 32,19 29,13" fill="#F5D0FE" opacity="0.6"/>
  <line x1="32" y1="6" x2="32" y2="19" stroke="#FFFFFF" stroke-width="0.8"/>

  <!-- Étincelles magiques améliorées -->
  <path d="M 50 18 C 50 20.5 51 22 53 22 C 51 22 50 23.5 50 26 C 50 23.5 49 22 47 22 C 49 22 50 20.5 50 18 Z" fill="#FDF4FF"/>
  <path d="M 13 22 C 13 23.5 14 24.5 15.5 24.5 C 14 24.5 13 25.5 13 27 C 13 25.5 12 24.5 10.5 24.5 C 12 24.5 13 23.5 13 22 Z" fill="#F5D0FE"/>
  <circle cx="48" cy="46" r="1.4" fill="#E879F9"/>
  <circle cx="16" cy="45" r="1" fill="#FFFFFF"/>
</svg>

