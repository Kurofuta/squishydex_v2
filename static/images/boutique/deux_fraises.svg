<svg viewBox="0 0 64 64" width="60" height="60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradé corps de fraise principale -->
    <linearGradient id="sb_g1" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FF6B8B"/>
      <stop offset="35%" stop-color="#FF1744"/>
      <stop offset="85%" stop-color="#D50000"/>
      <stop offset="100%" stop-color="#9B0000"/>
    </linearGradient>
    <!-- Dégradé corps deuxième fraise -->
    <linearGradient id="sb_g2" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FF80AB"/>
      <stop offset="40%" stop-color="#F50057"/>
      <stop offset="90%" stop-color="#C51162"/>
    </linearGradient>
    <!-- Dégradé feuilles -->
    <linearGradient id="sb_leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="60%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <!-- Dégradé queue de fraise -->
    <linearGradient id="sb_stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5D6A7"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>
  </defs>

  <!-- Ombre au sol -->
  <ellipse cx="32" cy="55" rx="22" ry="5.5" fill="#F8BBD0" opacity="0.6"/>

  <!-- Fraise arrière (gauche) -->
  <g transform="translate(14, 18) rotate(-14)">
    <!-- Queue -->
    <path d="M12 7 C12 3, 14 1, 17 0 C16 3, 15 6, 13 8 Z" fill="url(#sb_stem)"/>
    <!-- Corps -->
    <path d="M4 14 C1 22, 5 32, 13 36 C21 32, 25 22, 22 14 C20 9, 6 9, 4 14 Z" fill="url(#sb_g2)"/>
    <!-- Graines -->
    <circle cx="8" cy="18" r="0.8" fill="#FFF59D"/>
    <circle cx="13" cy="20" r="0.8" fill="#FFF59D"/>
    <circle cx="18" cy="18" r="0.8" fill="#FFF59D"/>
    <circle cx="10" cy="25" r="0.8" fill="#FFF59D"/>
    <circle cx="16" cy="26" r="0.8" fill="#FFF59D"/>
    <circle cx="13" cy="30" r="0.8" fill="#FFF59D"/>
    <!-- Feuilles -->
    <path d="M13 11 C11 6, 6 7, 5 11 C9 11, 11 12, 13 11 Z" fill="url(#sb_leaf)"/>
    <path d="M13 11 C14 5, 20 6, 21 11 C17 11, 15 12, 13 11 Z" fill="url(#sb_leaf)"/>
    <path d="M13 11 C13 5, 15 5, 15 11 Z" fill="#66BB6A"/>
  </g>

  <!-- Fraise avant (droite, plus grande et dodue) -->
  <g transform="translate(24, 17) rotate(10)">
    <!-- Ombre propre -->
    <ellipse cx="16" cy="36" rx="14" ry="4" fill="rgba(0,0,0,0.12)"/>
    <!-- Queue -->
    <path d="M15 8 C15 3, 18 1, 21 0 C20 4, 18 7, 16 9 Z" fill="url(#sb_stem)"/>
    <!-- Corps -->
    <path d="M5 16 C1 26, 6 38, 16 42 C26 38, 31 26, 27 16 C24 10, 8 10, 5 16 Z" fill="url(#sb_g1)"/>
    <!-- Reflet brillant kawaii -->
    <path d="M8 17 C6 22, 8 28, 10 30 C9 27, 8 23, 10 18 C11 15, 14 14, 16 13 C12 13, 9 15, 8 17 Z" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="12" cy="16" r="1.5" fill="#FFFFFF" opacity="0.6"/>
    <!-- Graines dorées -->
    <ellipse cx="11" cy="21" rx="0.9" ry="1.2" fill="#FFF9C4" transform="rotate(-10 11 21)"/>
    <ellipse cx="17" cy="22" rx="0.9" ry="1.2" fill="#FFF9C4"/>
    <ellipse cx="23" cy="21" rx="0.9" ry="1.2" fill="#FFF9C4" transform="rotate(10 23 21)"/>
    <ellipse cx="9" cy="27" rx="0.9" ry="1.2" fill="#FFF9C4" transform="rotate(-15 9 27)"/>
    <ellipse cx="15" cy="28" rx="0.9" ry="1.2" fill="#FFF9C4"/>
    <ellipse cx="21" cy="28" rx="0.9" ry="1.2" fill="#FFF9C4" transform="rotate(15 21 28)"/>
    <ellipse cx="12" cy="34" rx="0.9" ry="1.2" fill="#FFF9C4" transform="rotate(-5 12 34)"/>
    <ellipse cx="18" cy="34" rx="0.9" ry="1.2" fill="#FFF9C4" transform="rotate(5 18 34)"/>
    <circle cx="16" cy="38" r="0.8" fill="#FFF9C4"/>
    <!-- Feuilles calice vert -->
    <path d="M16 12 C13 6, 6 8, 5 13 C11 13, 14 14, 16 12 Z" fill="url(#sb_leaf)"/>
    <path d="M16 12 C18 5, 26 6, 27 12 C21 13, 18 14, 16 12 Z" fill="url(#sb_leaf)"/>
    <path d="M16 12 C15 4, 19 4, 18 12 Z" fill="#66BB6A"/>
    <path d="M16 12 C11 10, 11 15, 14 15 Z" fill="#43A047"/>
    <path d="M16 12 C21 10, 21 15, 18 15 Z" fill="#388E3C"/>
  </g>

  <!-- Étincelles mignonnes -->
  <path d="M49 10 C49 13, 51 15, 54 15 C51 15, 49 17, 49 20 C49 17, 47 15, 44 15 C47 15, 49 13, 49 10 Z" fill="#FFE082"/>
  <circle cx="12" cy="16" r="1.5" fill="#FFE082"/>
  <circle cx="53" cy="28" r="1" fill="#FFF9C4"/>
</svg>

