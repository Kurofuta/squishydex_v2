<svg viewBox="0 0 64 64" width="60" height="60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradés du panier en osier -->
    <linearGradient id="bsk_body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5B888"/>
      <stop offset="35%" stop-color="#CA8A52"/>
      <stop offset="100%" stop-color="#7D491F"/>
    </linearGradient>
    <linearGradient id="bsk_rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C5E28"/>
      <stop offset="50%" stop-color="#F5DAB0"/>
      <stop offset="100%" stop-color="#7D491F"/>
    </linearGradient>
    <linearGradient id="bsk_handle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5DAB0"/>
      <stop offset="50%" stop-color="#CA8A52"/>
      <stop offset="100%" stop-color="#6E3E18"/>
    </linearGradient>

    <!-- Dégradés des fraises -->
    <linearGradient id="sb_red1" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="40%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="sb_red2" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FF7997"/>
      <stop offset="40%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </linearGradient>
    <linearGradient id="sb_leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5D6A7"/>
      <stop offset="50%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>

  <!-- 1. Ombre au sol -->
  <ellipse cx="32" cy="57" rx="25" ry="4.5" fill="#F8BBD0" opacity="0.65"/>

  <!-- 2. Anse du panier (en arrière-plan) -->
  <path d="M 16 32 C 16 7, 48 7, 48 32" stroke="url(#bsk_handle)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M 17 32 C 17 9, 47 9, 47 32" stroke="#FFF2D6" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- 3. Fond intérieur sombre du panier (pour donner de la profondeur derrière les fraises) -->
  <ellipse cx="32" cy="30" rx="20" ry="5.5" fill="#422108"/>

  <!-- 4. === LES FRAISES : SITUÉES À L'INTÉRIEUR DU PANIER (Empilées généreusement vers le haut) === -->

  <!-- Fraise 1 : Arrière-gauche -->
  <g transform="translate(14, 13) scale(0.74) rotate(-16)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#sb_red1)"/>
    <circle cx="8" cy="15" r="0.7" fill="#FFE082"/>
    <circle cx="14" cy="15" r="0.7" fill="#FFE082"/>
    <circle cx="11" cy="22" r="0.7" fill="#FFE082"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#sb_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#sb_leaf)"/>
  </g>

  <!-- Fraise 2 : Arrière-droite -->
  <g transform="translate(37, 13) scale(0.74) rotate(16)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#sb_red1)"/>
    <circle cx="8" cy="15" r="0.7" fill="#FFE082"/>
    <circle cx="14" cy="15" r="0.7" fill="#FFE082"/>
    <circle cx="11" cy="22" r="0.7" fill="#FFE082"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#sb_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#sb_leaf)"/>
  </g>

  <!-- Fraise 3 : Au sommet au milieu (la reine du panier !) -->
  <g transform="translate(25, 7) scale(0.92)">
    <!-- Queue verte -->
    <path d="M11 6 C11 3, 13 1, 15 0 C14 3, 13 5, 12 7 Z" fill="#388E3C"/>
    <!-- Corps fraise -->
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#sb_red2)"/>
    <!-- Reflet brillant -->
    <path d="M6 13 C4 17, 5 21, 7 23 C6 20, 5 17, 7 14 C8 12, 10 11, 12 10 C9 10, 7 11, 6 13 Z" fill="#FFFFFF" opacity="0.45"/>
    <!-- Graines dorées -->
    <circle cx="8" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="13" cy="17" r="0.7" fill="#FFF9C4"/>
    <circle cx="17" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="10" cy="22" r="0.7" fill="#FFF9C4"/>
    <circle cx="15" cy="22" r="0.7" fill="#FFF9C4"/>
    <!-- Feuilles calice -->
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#sb_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#sb_leaf)"/>
    <path d="M12 9 C12 4, 14 4, 13 9 Z" fill="#81C784"/>
  </g>

  <!-- Fraise 4 : Milieu gauche -->
  <g transform="translate(18, 17) scale(0.82) rotate(-8)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#sb_red1)"/>
    <path d="M6 13 C4 17, 5 21, 7 23 C6 20, 5 17, 7 14 C8 12, 10 11, 12 10 C9 10, 7 11, 6 13 Z" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="8" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="13" cy="17" r="0.7" fill="#FFF9C4"/>
    <circle cx="17" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="11" cy="22" r="0.7" fill="#FFF9C4"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#sb_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#sb_leaf)"/>
  </g>

  <!-- Fraise 5 : Milieu droite -->
  <g transform="translate(34, 17) scale(0.82) rotate(8)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#sb_red2)"/>
    <path d="M6 13 C4 17, 5 21, 7 23 C6 20, 5 17, 7 14 C8 12, 10 11, 12 10 C9 10, 7 11, 6 13 Z" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="8" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="13" cy="17" r="0.7" fill="#FFF9C4"/>
    <circle cx="17" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="13" cy="22" r="0.7" fill="#FFF9C4"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#sb_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#sb_leaf)"/>
  </g>

  <!-- Fraise 6 : Centre avant (bien calée à l'intérieur sous le rebord) -->
  <g transform="translate(26, 19) scale(0.8)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#sb_red1)"/>
    <path d="M6 13 C4 17, 5 21, 7 23 C6 20, 5 17, 7 14 C8 12, 10 11, 12 10 C9 10, 7 11, 6 13 Z" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="8" cy="15" r="0.65" fill="#FFF9C4"/>
    <circle cx="12" cy="17" r="0.65" fill="#FFF9C4"/>
    <circle cx="16" cy="15" r="0.65" fill="#FFF9C4"/>
    <circle cx="12" cy="22" r="0.65" fill="#FFF9C4"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#sb_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#sb_leaf)"/>
  </g>

  <!-- 5. === CORPS ET FAÇADE DU PANIER EN OSIER (AU PREMIER PLAN : RECOUVRE LA BASE DES FRAISES) === -->

  <!-- Corps extérieur du panier en osier -->
  <path d="M 11 31.5 L 17.5 53 C 18 55, 46 55, 46.5 53 L 53 31.5 Q 32 36.5 11 31.5 Z" fill="url(#bsk_body)" stroke="#4A250B" stroke-width="1.1"/>

  <!-- Bordure / Rebord supérieur tressé (épais et visible par-dessus les fraises) -->
  <path d="M 10 31.5 Q 32 37 54 31.5 Q 32 33.5 10 31.5 Z" fill="url(#bsk_rim)" stroke="#4A250B" stroke-width="1.1"/>
  <path d="M 11.5 31.8 Q 32 36 52.5 31.8" stroke="#FFF2D6" stroke-width="0.8" fill="none" opacity="0.75"/>

  <!-- Tressage d'osier (lignes horizontales courbes épousant la forme bombée) -->
  <path d="M 13 37.5 Q 32 42.5 51 37.5" stroke="#4A250B" stroke-width="1.2" fill="none" opacity="0.7"/>
  <path d="M 15 43.5 Q 32 48 49 43.5" stroke="#4A250B" stroke-width="1.2" fill="none" opacity="0.7"/>
  <path d="M 17 49 Q 32 53 47 49" stroke="#4A250B" stroke-width="1.1" fill="none" opacity="0.6"/>

  <!-- Tressage vertical de l'osier -->
  <line x1="21" y1="34" x2="22.5" y2="52.5" stroke="#4A250B" stroke-width="1" opacity="0.5"/>
  <line x1="27" y1="35.5" x2="28" y2="53.5" stroke="#4A250B" stroke-width="1" opacity="0.5"/>
  <line x1="32" y1="36" x2="32" y2="54" stroke="#4A250B" stroke-width="1" opacity="0.5"/>
  <line x1="37" y1="35.5" x2="36" y2="53.5" stroke="#4A250B" stroke-width="1" opacity="0.5"/>
  <line x1="43" y1="34" x2="41.5" y2="52.5" stroke="#4A250B" stroke-width="1" opacity="0.5"/>

  <!-- Petite feuille verte décorative délicatement posée sur le bord de l'osier -->
  <path d="M 23 33 C 21 34.5, 21 37.5, 23 38.5 C 24.5 37, 25 34.5, 23 33 Z" fill="#66BB6A" stroke="#2E7D32" stroke-width="0.5"/>

  <!-- Joli nœud ruban rose centré sur la façade du panier -->
  <g transform="translate(32, 41)">
    <ellipse cx="-4.5" cy="0" rx="4" ry="2.2" fill="#FF4081" transform="rotate(-15 -4.5 0)"/>
    <ellipse cx="4.5" cy="0" rx="4" ry="2.2" fill="#FF4081" transform="rotate(15 4.5 0)"/>
    <circle cx="0" cy="0" r="2.2" fill="#F50057"/>
    <path d="M-1.2 1.2 L-3.5 6" stroke="#F50057" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M1.2 1.2 L3.5 6" stroke="#F50057" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- 6. Étoiles et étincelles dorées kawaii -->
  <path d="M 52 11 C 52 14, 54 16, 57 16 C 54 16, 52 18, 52 21 C 52 18, 50 16, 47 16 C 50 16, 52 14, 52 11 Z" fill="#FFE082"/>
  <circle cx="10" cy="18" r="1.3" fill="#FFE082"/>
</svg>
