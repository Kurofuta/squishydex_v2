<svg viewBox="0 0 64 64" width="60" height="60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradés du panier en osier -->
    <linearGradient id="bsk_body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5B888"/>
      <stop offset="35%" stop-color="#CA8A52"/>
      <stop offset="100%" stop-color="#804E24"/>
    </linearGradient>
    <linearGradient id="bsk_rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A56A36"/>
      <stop offset="50%" stop-color="#F3D5A5"/>
      <stop offset="100%" stop-color="#8E5422"/>
    </linearGradient>
    <linearGradient id="bsk_handle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3D5A5"/>
      <stop offset="50%" stop-color="#CA8A52"/>
      <stop offset="100%" stop-color="#6E3E18"/>
    </linearGradient>

    <!-- Dégradés des fraises -->
    <linearGradient id="sb_red1" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="40%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="sb_red2" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FF7997"/>
      <stop offset="40%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </linearGradient>
    <linearGradient id="sb_leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5D6A7"/>
      <stop offset="50%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>

  <!-- 1. Ombre au sol -->
  <ellipse cx="32" cy="57" rx="25" ry="5" fill="#F8BBD0" opacity="0.65"/>

  <!-- 2. Anse du panier (en arrière-plan) -->
  <path d="M 16 34 C 16 10, 48 10, 48 34" stroke="url(#bsk_handle)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 17 34 C 17 12, 47 12, 47 34" stroke="#FFF2D6" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- 3. Fond intérieur sombre du panier (pour donner de la profondeur sous les fraises) -->
  <ellipse cx="32" cy="32" rx="19" ry="5.5" fill="#522E13"/>

  <!-- 4. Corps extérieur du panier en osier -->
  <path d="M 12 32 L 18 53 C 18 55, 46 55, 46 53 L 52 32 Z" fill="url(#bsk_body)"/>

  <!-- Bord supérieur ovale en osier -->
  <ellipse cx="32" cy="32" rx="20.5" ry="4" fill="url(#bsk_rim)" stroke="#522E13" stroke-width="1"/>
  <ellipse cx="32" cy="31.5" rx="19.5" ry="3" fill="none" stroke="#FFF2D6" stroke-width="0.8" opacity="0.7"/>

  <!-- Tressage d'osier (lignes horizontales) -->
  <path d="M 14 38 Q 32 43 50 38" stroke="#522E13" stroke-width="1.2" fill="none" opacity="0.75"/>
  <path d="M 16 44 Q 32 49 48 44" stroke="#522E13" stroke-width="1.2" fill="none" opacity="0.75"/>
  <path d="M 17.5 49 Q 32 53.5 46.5 49" stroke="#522E13" stroke-width="1" fill="none" opacity="0.65"/>

  <!-- Tressage vertical de l'osier -->
  <line x1="20" y1="34" x2="22" y2="53" stroke="#522E13" stroke-width="1" opacity="0.5"/>
  <line x1="26" y1="35" x2="27" y2="54" stroke="#522E13" stroke-width="1" opacity="0.5"/>
  <line x1="32" y1="36" x2="32" y2="54.5" stroke="#522E13" stroke-width="1" opacity="0.5"/>
  <line x1="38" y1="35" x2="37" y2="54" stroke="#522E13" stroke-width="1" opacity="0.5"/>
  <line x1="44" y1="34" x2="42" y2="53" stroke="#522E13" stroke-width="1" opacity="0.5"/>

  <!-- Joli nœud ruban rose centré sur la façade du panier -->
  <g transform="translate(32, 41)">
    <ellipse cx="-4" cy="0" rx="3.5" ry="2" fill="#FF4081" transform="rotate(-15 -4 0)"/>
    <ellipse cx="4" cy="0" rx="3.5" ry="2" fill="#FF4081" transform="rotate(15 4 0)"/>
    <circle cx="0" cy="0" r="2" fill="#F50057"/>
    <path d="M-1 1 L-3 5.5" stroke="#F50057" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M1 1 L3 5.5" stroke="#F50057" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- 5. === LES FRAISES AU PREMIER PLAN (Par-dessus le panier, débordant fièrement !) === -->

  <!-- Fraise 1 : Arrière-gauche qui dépasse -->
  <g transform="translate(15, 14) scale(0.75) rotate(-16)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#sb_red1)"/>
    <circle cx="8" cy="15" r="0.7" fill="#FFE082"/>
    <circle cx="14" cy="15" r="0.7" fill="#FFE082"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#sb_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#sb_leaf)"/>
  </g>

  <!-- Fraise 2 : Arrière-droite qui dépasse -->
  <g transform="translate(36, 14) scale(0.75) rotate(16)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#sb_red1)"/>
    <circle cx="8" cy="15" r="0.7" fill="#FFE082"/>
    <circle cx="14" cy="15" r="0.7" fill="#FFE082"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#sb_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#sb_leaf)"/>
  </g>

  <!-- Fraise 3 : Au sommet au milieu (la reine du panier !) -->
  <g transform="translate(25, 9) scale(0.95)">
    <!-- Queue -->
    <path d="M11 6 C11 3, 13 1, 15 0 C14 3, 13 5, 12 7 Z" fill="#388E3C"/>
    <!-- Corps -->
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#sb_red2)"/>
    <!-- Brillance -->
    <path d="M6 13 C4 17, 5 21, 7 23 C6 20, 5 17, 7 14 C8 12, 10 11, 12 10 C9 10, 7 11, 6 13 Z" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="8" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="13" cy="17" r="0.7" fill="#FFF9C4"/>
    <circle cx="17" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="10" cy="22" r="0.7" fill="#FFF9C4"/>
    <circle cx="15" cy="22" r="0.7" fill="#FFF9C4"/>
    <!-- Feuilles calice -->
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#sb_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#sb_leaf)"/>
    <path d="M12 9 C12 4, 14 4, 13 9 Z" fill="#81C784"/>
  </g>

  <!-- Fraise 4 : Au premier plan à gauche (déborde joliment sur le rebord du panier) -->
  <g transform="translate(16, 20) scale(0.85) rotate(-8)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#sb_red1)"/>
    <path d="M6 13 C4 17, 5 21, 7 23 C6 20, 5 17, 7 14 C8 12, 10 11, 12 10 C9 10, 7 11, 6 13 Z" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="8" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="13" cy="17" r="0.7" fill="#FFF9C4"/>
    <circle cx="17" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="10" cy="22" r="0.7" fill="#FFF9C4"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#sb_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#sb_leaf)"/>
  </g>

  <!-- Fraise 5 : Au premier plan à droite (déborde joliment sur le rebord droit) -->
  <g transform="translate(34, 20) scale(0.85) rotate(8)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#sb_red2)"/>
    <path d="M6 13 C4 17, 5 21, 7 23 C6 20, 5 17, 7 14 C8 12, 10 11, 12 10 C9 10, 7 11, 6 13 Z" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="8" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="13" cy="17" r="0.7" fill="#FFF9C4"/>
    <circle cx="17" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="14" cy="22" r="0.7" fill="#FFF9C4"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#sb_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#sb_leaf)"/>
  </g>

  <!-- Fraise 6 : Au tout premier plan au centre, reposant délicatement sur le bord -->
  <g transform="translate(25, 23) scale(0.78)">
    <path d="M4 11 C1 19, 5 26, 12 28 C19 26, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#sb_red1)"/>
    <circle cx="8" cy="15" r="0.65" fill="#FFF9C4"/>
    <circle cx="12" cy="17" r="0.65" fill="#FFF9C4"/>
    <circle cx="16" cy="15" r="0.65" fill="#FFF9C4"/>
    <circle cx="12" cy="22" r="0.65" fill="#FFF9C4"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#sb_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#sb_leaf)"/>
  </g>

  <!-- 6. Étoiles et étincelles magiques -->
  <path d="M 52 12 C 52 15, 54 17, 57 17 C 54 17, 52 19, 52 22 C 52 19, 50 17, 47 17 C 50 17, 52 15, 52 12 Z" fill="#FFE082"/>
  <circle cx="11" cy="20" r="1.3" fill="#FFF59D"/>
</svg>
