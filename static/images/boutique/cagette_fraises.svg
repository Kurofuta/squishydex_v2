<svg viewBox="0 0 64 64" width="60" height="60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradés bois cagette -->
    <linearGradient id="cg_plank1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4B485"/>
      <stop offset="40%" stop-color="#CA9563"/>
      <stop offset="100%" stop-color="#8F5829"/>
    </linearGradient>
    <linearGradient id="cg_plank2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D79E69"/>
      <stop offset="40%" stop-color="#B87E4A"/>
      <stop offset="100%" stop-color="#79461E"/>
    </linearGradient>
    <linearGradient id="cg_post" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A602F"/>
      <stop offset="50%" stop-color="#D79E69"/>
      <stop offset="100%" stop-color="#79461E"/>
    </linearGradient>

    <!-- Dégradés fraises -->
    <linearGradient id="cg_red1" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="40%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="cg_red2" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FF7997"/>
      <stop offset="40%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </linearGradient>
    <linearGradient id="cg_leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5D6A7"/>
      <stop offset="50%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>

  <!-- Ombre au sol -->
  <ellipse cx="32" cy="57" rx="27" ry="5" fill="#F8BBD0" opacity="0.65"/>

  <!-- Fond intérieur de la cagette (bois sombre intérieur pour masquer tout trou) -->
  <polygon points="9,26 55,26 52,54 12,54" fill="#5D3A1A"/>
  <rect x="11" y="24" width="42" height="12" fill="#784B23" opacity="0.8"/>

  <!-- === Fraises dans la cagette (Rangée arrière haute) === -->
  <!-- Fraise 1 : Arrière gauche -->
  <g transform="translate(13, 16) scale(0.72) rotate(-12)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#cg_red1)"/>
    <circle cx="8" cy="15" r="0.7" fill="#FFE082"/>
    <circle cx="14" cy="15" r="0.7" fill="#FFE082"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#cg_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#cg_leaf)"/>
  </g>

  <!-- Fraise 2 : Arrière centre-gauche -->
  <g transform="translate(24, 13) scale(0.8) rotate(4)">
    <path d="M11 6 C11 3, 13 1, 15 0 C14 3, 13 5, 12 7 Z" fill="#388E3C"/>
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#cg_red2)"/>
    <path d="M6 13 C4 17, 5 21, 7 23 C6 20, 5 17, 7 14 C8 12, 10 11, 12 10 C9 10, 7 11, 6 13 Z" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="8" cy="16" r="0.7" fill="#FFF9C4"/>
    <circle cx="13" cy="18" r="0.7" fill="#FFF9C4"/>
    <circle cx="17" cy="16" r="0.7" fill="#FFF9C4"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#cg_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#cg_leaf)"/>
  </g>

  <!-- Fraise 3 : Arrière centre-droit -->
  <g transform="translate(35, 14) scale(0.78) rotate(-6)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#cg_red1)"/>
    <circle cx="8" cy="15" r="0.7" fill="#FFE082"/>
    <circle cx="13" cy="17" r="0.7" fill="#FFE082"/>
    <circle cx="17" cy="15" r="0.7" fill="#FFE082"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#cg_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#cg_leaf)"/>
  </g>

  <!-- Fraise 4 : Arrière droite -->
  <g transform="translate(43, 17) scale(0.7) rotate(14)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#cg_red2)"/>
    <circle cx="8" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="14" cy="15" r="0.7" fill="#FFF9C4"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#cg_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#cg_leaf)"/>
  </g>

  <!-- === Fraises au niveau du bord supérieur === -->
  <!-- Fraise 5 : Avant gauche -->
  <g transform="translate(16, 22) scale(0.8) rotate(10)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#cg_red1)"/>
    <circle cx="8" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="13" cy="17" r="0.7" fill="#FFF9C4"/>
    <circle cx="17" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="10" cy="22" r="0.7" fill="#FFF9C4"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#cg_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#cg_leaf)"/>
  </g>

  <!-- Fraise 6 : Avant droite -->
  <g transform="translate(34, 22) scale(0.8) rotate(-10)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#cg_red2)"/>
    <circle cx="8" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="13" cy="17" r="0.7" fill="#FFF9C4"/>
    <circle cx="17" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="14" cy="22" r="0.7" fill="#FFF9C4"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#cg_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#cg_leaf)"/>
  </g>

  <!-- === Face avant de la cagette en bois === -->
  <!-- Planche supérieure de façade -->
  <rect x="7" y="32" width="50" height="9" rx="1.5" fill="url(#cg_plank1)" stroke="#6A3B18" stroke-width="0.8"/>
  <line x1="8" y1="33" x2="56" y2="33" stroke="#FFF2D6" stroke-width="1" opacity="0.6"/>

  <!-- Planche inférieure de façade -->
  <rect x="8.5" y="44" width="47" height="9.5" rx="1.5" fill="url(#cg_plank2)" stroke="#6A3B18" stroke-width="0.8"/>
  <line x1="9.5" y1="45" x2="54.5" y2="45" stroke="#FFF2D6" stroke-width="1" opacity="0.5"/>

  <!-- Montants d'angles (piliers en bois solide sur les côtés) -->
  <path d="M 6 30 L 12 30 L 14 54.5 L 8 54.5 Z" fill="url(#cg_post)" stroke="#532B0F" stroke-width="0.8"/>
  <path d="M 58 30 L 52 30 L 50 54.5 L 56 54.5 Z" fill="url(#cg_post)" stroke="#532B0F" stroke-width="0.8"/>
  <rect x="30" y="31.5" width="4" height="22.5" fill="#79461E" opacity="0.6"/>

  <!-- Clous métalliques d'assemblage -->
  <circle cx="9.5" cy="36.5" r="1.2" fill="#2E1C0C"/>
  <circle cx="9.5" cy="36.5" r="0.6" fill="#8D6E63"/>
  <circle cx="10.5" cy="48.5" r="1.2" fill="#2E1C0C"/>
  <circle cx="10.5" cy="48.5" r="0.6" fill="#8D6E63"/>

  <circle cx="54.5" cy="36.5" r="1.2" fill="#2E1C0C"/>
  <circle cx="54.5" cy="36.5" r="0.6" fill="#8D6E63"/>
  <circle cx="53.5" cy="48.5" r="1.2" fill="#2E1C0C"/>
  <circle cx="53.5" cy="48.5" r="0.6" fill="#8D6E63"/>

  <!-- Petite feuille verte drapée sur le bord de la cagette -->
  <path d="M 28 32 C 25 34, 25 38, 28 39 C 30 37, 31 34, 28 32 Z" fill="#66BB6A" stroke="#2E7D32" stroke-width="0.6"/>

  <!-- Étincelles dorées brillantes (Qualité Royale) -->
  <path d="M 52 11 C 52 14, 54 16, 57 16 C 54 16, 52 18, 52 21 C 52 18, 50 16, 47 16 C 50 16, 52 14, 52 11 Z" fill="#FFE082"/>
  <circle cx="9" cy="18" r="1.4" fill="#FFE082"/>
</svg>
