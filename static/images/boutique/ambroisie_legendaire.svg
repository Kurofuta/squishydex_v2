<svg viewBox="0 0 64 64" width="60" height="60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Or divin rayonnant -->
    <linearGradient id="amb_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <!-- Ambroisie prismatique céleste -->
    <linearGradient id="amb_essence" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#F472B6"/>
      <stop offset="45%" stop-color="#C084FC"/>
      <stop offset="75%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <!-- Halo divin -->
    <radialGradient id="amb_halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#C084FC" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <!-- Rubis légendaire -->
    <linearGradient id="amb_ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
  </defs>

  <!-- Ombre douce pastel -->
  <ellipse cx="32" cy="57" rx="26" ry="5.5" fill="#fbcfe8" opacity="0.9"/>

  <!-- Halo d'énergie divine en arrière-plan -->
  <circle cx="32" cy="35" r="24" fill="url(#amb_halo)"/>

  <!-- Rayons de lumière céleste -->
  <line x1="32" y1="8" x2="32" y2="3" stroke="#FDE047" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <line x1="16" y1="14" x2="12" y2="10" stroke="#FDE047" stroke-width="1" stroke-linecap="round" opacity="0.65"/>
  <line x1="48" y1="14" x2="52" y2="10" stroke="#FDE047" stroke-width="1" stroke-linecap="round" opacity="0.65"/>

  <!-- === GRANDES AILES DORÉES DÉPLOYÉES === -->
  <!-- Aile gauche -->
  <g>
    <!-- Plumes arrière -->
    <path d="M 23 35 C 13 32 4 23 6 15 C 8 22 14 28 20 30 C 13 25 9 18 10 12 C 14 18 18 24 22 27 Z" fill="url(#amb_gold)" stroke="#78350F" stroke-width="0.7"/>
    <!-- Plume principale arquée -->
    <path d="M 24 38 C 15 37 6 30 7 21 C 11 27 18 31 23 32 Z" fill="#FDE047" stroke="#92400E" stroke-width="0.7"/>
    <!-- Plume inférieure -->
    <path d="M 24 43 C 18 42 12 37 12 32 C 16 35 20 37 24 38 Z" fill="#F59E0B" stroke="#78350F" stroke-width="0.7"/>
  </g>

  <!-- Aile droite -->
  <g>
    <!-- Plumes arrière -->
    <path d="M 41 35 C 51 32 60 23 58 15 C 56 22 50 28 44 30 C 51 25 55 18 54 12 C 50 18 46 24 42 27 Z" fill="url(#amb_gold)" stroke="#78350F" stroke-width="0.7"/>
    <!-- Plume principale arquée -->
    <path d="M 40 38 C 49 37 58 30 57 21 C 53 27 46 31 41 32 Z" fill="#FDE047" stroke="#92400E" stroke-width="0.7"/>
    <!-- Plume inférieure -->
    <path d="M 40 43 C 46 42 52 37 52 32 C 48 35 44 37 40 38 Z" fill="#F59E0B" stroke="#78350F" stroke-width="0.7"/>
  </g>

  <!-- === LE CALICE / COUPE ROYALE EN OR PUR === -->
  <!-- Pied du calice -->
  <path d="M 25 54 C 28 55.5 36 55.5 39 54 L 37 47 L 27 47 Z" fill="url(#amb_gold)" stroke="#78350F" stroke-width="0.9"/>
  <!-- Nœud orfévré du pied -->
  <ellipse cx="32" cy="46" rx="4.5" ry="2" fill="#FDE047" stroke="#92400E" stroke-width="0.8"/>
  <circle cx="32" cy="46" r="1.3" fill="url(#amb_ruby)"/>

  <!-- Corps de la coupe / calice doré -->
  <path d="M 21 27 C 21 38 26 46 32 46 C 38 46 43 38 43 27 Z" fill="url(#amb_gold)" stroke="#78350F" stroke-width="1.2"/>

  <!-- Cœur prismatique de l'ambroisie (débordant du calice) -->
  <path d="M 22 26 C 22 36 26 44 32 44 C 38 44 42 36 42 26 Z" fill="url(#amb_essence)"/>

  <!-- Débordement lumineux et cascade magique d'ambroisie -->
  <!-- Nappe supérieure débordante -->
  <ellipse cx="32" cy="24" rx="12" ry="4.5" fill="url(#amb_essence)"/>
  <ellipse cx="32" cy="24" rx="10" ry="3" fill="#FFFFFF" opacity="0.85"/>

  <!-- Coulées d'ambroisie sur les bords -->
  <path d="M 20 25 C 19 28 20 32 22 33 C 23 31 23 27 22 25 Z" fill="#F472B6"/>
  <path d="M 44 25 C 45 29 43 33 41 33 C 41 30 42 27 43 25 Z" fill="#38BDF8"/>
  <path d="M 31 28 C 31 33 33 33 33 28 Z" fill="#FFFFFF"/>

  <!-- Décorations et joyaux sur le calice -->
  <ellipse cx="32" cy="35" rx="3.5" ry="4" fill="url(#amb_ruby)" stroke="#FFFBEB" stroke-width="0.6"/>
  <!-- Reflet étoile sur le rubis -->
  <circle cx="31" cy="33.5" r="0.8" fill="#FFFFFF"/>

  <!-- Frise dorée festonnée au rebord du calice -->
  <path d="M 20 24 C 23 26 41 26 44 24" stroke="#FEF08A" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- === COURONNE / HALO CÉLESTE FLOTTANT === -->
  <ellipse cx="32" cy="11" rx="11" ry="3" fill="none" stroke="#FDE047" stroke-width="1.5"/>
  <ellipse cx="32" cy="11" rx="11" ry="3" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.8"/>

  <!-- Gemme du sommet rayonnante (en lévitation au centre du halo) -->
  <polygon points="32,6 34,9 36,9 34,11 35,14 32,12 29,14 30,11 28,9 30,9" fill="#FFFBEB" stroke="#E11D48" stroke-width="0.6"/>

  <!-- === ÉTINCELLES DIVINES ET ÉCLATS PRISMATIQUES === -->
  <!-- Grande étincelle divine haut droite -->
  <path d="M 48 5 C 48 8.5 49.5 10.5 52.5 10.5 C 49.5 10.5 48 12.5 48 16 C 48 12.5 46.5 10.5 43.5 10.5 C 46.5 10.5 48 8.5 48 5 Z" fill="#FFFBEB"/>
  <!-- Étincelle haut gauche -->
  <path d="M 14 5 C 14 7.5 15 9 17 9 C 15 9 14 10.5 14 13 C 14 10.5 13 9 11 9 C 13 9 14 7.5 14 5 Z" fill="#FDE047"/>
  <!-- Étoile bas droite -->
  <path d="M 52 46 C 52 47.5 53 48.5 54.5 48.5 C 53 48.5 52 49.5 52 51 C 52 49.5 51 48.5 49.5 48.5 C 51 48.5 52 47.5 52 46 Z" fill="#38BDF8"/>
  <!-- Étoile bas gauche -->
  <circle cx="10" cy="48" r="1.3" fill="#F472B6"/>
  <circle cx="32" cy="20" r="1.5" fill="#FFFFFF"/>
</svg>

