<svg viewBox="0 0 64 64" width="60" height="60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ptf_red1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="50%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="ptf_red2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6E6E"/>
      <stop offset="50%" stop-color="#F44336"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <linearGradient id="ptf_red3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7997"/>
      <stop offset="40%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </linearGradient>
    <linearGradient id="ptf_leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="ptf_leaf2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5D6A7"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>
  </defs>

  <!-- Ombre au sol -->
  <ellipse cx="32" cy="56" rx="26" ry="6" fill="#F8BBD0" opacity="0.65"/>

  <!-- Fraise 1 : Arrière gauche -->
  <g transform="translate(11, 25) rotate(-18)">
    <path d="M4 10 C2 17, 5 24, 11 27 C17 24, 20 17, 18 10 C16 6, 6 6, 4 10 Z" fill="url(#ptf_red1)"/>
    <circle cx="7" cy="14" r="0.7" fill="#FFE082"/>
    <circle cx="11" cy="16" r="0.7" fill="#FFE082"/>
    <circle cx="15" cy="14" r="0.7" fill="#FFE082"/>
    <circle cx="9" cy="20" r="0.7" fill="#FFE082"/>
    <circle cx="13" cy="21" r="0.7" fill="#FFE082"/>
    <!-- Feuilles -->
    <path d="M11 8 C9 4, 5 5, 4 8 C8 8, 10 9, 11 8 Z" fill="url(#ptf_leaf)"/>
    <path d="M11 8 C12 3, 17 4, 18 8 C14 8, 12 9, 11 8 Z" fill="url(#ptf_leaf)"/>
  </g>

  <!-- Fraise 2 : Arrière droite -->
  <g transform="translate(34, 25) rotate(20)">
    <path d="M4 10 C2 17, 5 24, 11 27 C17 24, 20 17, 18 10 C16 6, 6 6, 4 10 Z" fill="url(#ptf_red1)"/>
    <circle cx="7" cy="14" r="0.7" fill="#FFE082"/>
    <circle cx="11" cy="16" r="0.7" fill="#FFE082"/>
    <circle cx="15" cy="14" r="0.7" fill="#FFE082"/>
    <circle cx="9" cy="20" r="0.7" fill="#FFE082"/>
    <circle cx="13" cy="21" r="0.7" fill="#FFE082"/>
    <!-- Feuilles -->
    <path d="M11 8 C9 4, 5 5, 4 8 C8 8, 10 9, 11 8 Z" fill="url(#ptf_leaf)"/>
    <path d="M11 8 C12 3, 17 4, 18 8 C14 8, 12 9, 11 8 Z" fill="url(#ptf_leaf)"/>
  </g>

  <!-- Fraise 3 : Au sommet du tas -->
  <g transform="translate(22, 10) rotate(-4)">
    <!-- Queue -->
    <path d="M10 6 C10 3, 12 1, 14 0 C13 3, 12 5, 11 7 Z" fill="#388E3C"/>
    <!-- Corps -->
    <path d="M3 11 C0 19, 4 27, 11 30 C18 27, 22 19, 19 11 C17 7, 5 7, 3 11 Z" fill="url(#ptf_red3)"/>
    <!-- Graines -->
    <circle cx="6" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="11" cy="17" r="0.7" fill="#FFF9C4"/>
    <circle cx="16" cy="15" r="0.7" fill="#FFF9C4"/>
    <circle cx="8" cy="21" r="0.7" fill="#FFF9C4"/>
    <circle cx="14" cy="21" r="0.7" fill="#FFF9C4"/>
    <circle cx="11" cy="25" r="0.7" fill="#FFF9C4"/>
    <!-- Reflet -->
    <path d="M5 12 C3 16, 5 21, 7 23 C6 20, 5 17, 7 13 C8 11, 10 10, 11 10 C8 10, 6 11, 5 12 Z" fill="#FFFFFF" opacity="0.4"/>
    <!-- Feuilles -->
    <path d="M11 8 C8 4, 3 6, 2 9 C7 9, 9 10, 11 8 Z" fill="url(#ptf_leaf2)"/>
    <path d="M11 8 C13 3, 19 4, 20 9 C15 9, 13 10, 11 8 Z" fill="url(#ptf_leaf2)"/>
    <path d="M11 8 C11 3, 13 3, 12 8 Z" fill="#4CAF50"/>
  </g>

  <!-- Fraise 4 : Devant au centre (grosse et juteuse) -->
  <g transform="translate(19, 23)">
    <!-- Queue -->
    <path d="M13 7 C13 3, 16 1, 18 0 C17 3, 15 5, 14 8 Z" fill="#388E3C"/>
    <!-- Corps -->
    <path d="M4 14 C1 23, 6 33, 14 36 C22 33, 27 23, 24 14 C21 9, 7 9, 4 14 Z" fill="url(#ptf_red2)"/>
    <!-- Reflet brillant -->
    <path d="M6 15 C4 20, 6 25, 8 27 C7 24, 6 20, 8 16 C9 13, 12 12, 14 11 C10 11, 7 13, 6 15 Z" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="9" cy="14" r="1.3" fill="#FFFFFF" opacity="0.6"/>
    <!-- Graines dorées -->
    <circle cx="8" cy="18" r="0.8" fill="#FFF9C4"/>
    <circle cx="14" cy="19" r="0.8" fill="#FFF9C4"/>
    <circle cx="20" cy="18" r="0.8" fill="#FFF9C4"/>
    <circle cx="7" cy="24" r="0.8" fill="#FFF9C4"/>
    <circle cx="13" cy="25" r="0.8" fill="#FFF9C4"/>
    <circle cx="19" cy="24" r="0.8" fill="#FFF9C4"/>
    <circle cx="10" cy="30" r="0.8" fill="#FFF9C4"/>
    <circle cx="16" cy="30" r="0.8" fill="#FFF9C4"/>
    <!-- Feuilles calice -->
    <path d="M14 10 C11 5, 5 7, 4 11 C9 11, 12 12, 14 10 Z" fill="url(#ptf_leaf)"/>
    <path d="M14 10 C16 4, 23 5, 24 10 C19 11, 16 12, 14 10 Z" fill="url(#ptf_leaf)"/>
    <path d="M14 10 C14 4, 16 4, 15 10 Z" fill="#66BB6A"/>
  </g>

  <!-- Étincelle et étoiles -->
  <path d="M48 14 C48 17, 50 19, 53 19 C50 19, 48 21, 48 24 C48 21, 46 19, 43 19 C46 19, 48 17, 48 14 Z" fill="#FFE082"/>
  <circle cx="12" cy="18" r="1.5" fill="#FFE082"/>
  <circle cx="54" cy="35" r="1.2" fill="#FFF9C4"/>
</svg>

