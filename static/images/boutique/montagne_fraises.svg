<svg viewBox="0 0 64 64" width="60" height="60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Aura magique de fond -->
    <radialGradient id="mf_aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFD54F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF80AB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mf_red1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="40%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </linearGradient>
    <linearGradient id="mf_red2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="50%" stop-color="#E91E63"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </linearGradient>
    <linearGradient id="mf_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="mf_leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5D6A7"/>
      <stop offset="50%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>

  <!-- Halo magique doré/rose de fond -->
  <circle cx="32" cy="30" r="26" fill="url(#mf_aura)"/>

  <!-- Ombre au sol avec reflet doré -->
  <ellipse cx="32" cy="57" rx="27" ry="5.5" fill="#F8BBD0" opacity="0.6"/>
  <ellipse cx="32" cy="56" rx="20" ry="3.5" fill="#FFE082" opacity="0.4"/>

  <!-- Étage 1 : Base de la montagne de fraises -->
  <!-- Fraise base extrême gauche -->
  <g transform="translate(8, 37) scale(0.65) rotate(-22)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#mf_red1)"/>
    <circle cx="8" cy="15" r="0.8" fill="#FFE082"/>
    <circle cx="14" cy="15" r="0.8" fill="#FFE082"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#mf_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#mf_leaf)"/>
  </g>
  <!-- Fraise base gauche-centre -->
  <g transform="translate(18, 38) scale(0.72) rotate(-8)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#mf_red2)"/>
    <circle cx="8" cy="15" r="0.8" fill="#FFE082"/>
    <circle cx="14" cy="15" r="0.8" fill="#FFE082"/>
    <circle cx="11" cy="22" r="0.8" fill="#FFE082"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#mf_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#mf_leaf)"/>
  </g>
  <!-- Fraise base droite-centre -->
  <g transform="translate(32, 38) scale(0.72) rotate(8)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#mf_red1)"/>
    <circle cx="8" cy="15" r="0.8" fill="#FFE082"/>
    <circle cx="14" cy="15" r="0.8" fill="#FFE082"/>
    <circle cx="11" cy="22" r="0.8" fill="#FFE082"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#mf_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#mf_leaf)"/>
  </g>
  <!-- Fraise base extrême droite -->
  <g transform="translate(43, 37) scale(0.65) rotate(22)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#mf_red2)"/>
    <circle cx="8" cy="15" r="0.8" fill="#FFE082"/>
    <circle cx="14" cy="15" r="0.8" fill="#FFE082"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#mf_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#mf_leaf)"/>
  </g>

  <!-- Étage 2 : Milieu de la pyramide -->
  <g transform="translate(13, 26) scale(0.7) rotate(-14)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#mf_red2)"/>
    <circle cx="8" cy="15" r="0.8" fill="#FFF9C4"/>
    <circle cx="14" cy="15" r="0.8" fill="#FFF9C4"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#mf_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#mf_leaf)"/>
  </g>
  <g transform="translate(38, 26) scale(0.7) rotate(14)">
    <path d="M4 11 C1 19, 5 27, 12 30 C19 27, 23 19, 20 11 C18 7, 6 7, 4 11 Z" fill="url(#mf_red1)"/>
    <circle cx="8" cy="15" r="0.8" fill="#FFF9C4"/>
    <circle cx="14" cy="15" r="0.8" fill="#FFF9C4"/>
    <path d="M12 9 C9 5, 5 6, 4 9 C8 9, 10 10, 12 9 Z" fill="url(#mf_leaf)"/>
    <path d="M12 9 C13 4, 19 5, 20 9 C15 9, 13 10, 12 9 Z" fill="url(#mf_leaf)"/>
  </g>
  <!-- Fraise centrale au premier plan de l'étage 2 -->
  <g transform="translate(25, 29) scale(0.8)">
    <path d="M4 12 C1 20, 5 28, 13 31 C21 28, 25 20, 22 12 C19 7, 7 7, 4 12 Z" fill="url(#mf_red1)"/>
    <circle cx="8" cy="16" r="0.8" fill="#FFF9C4"/>
    <circle cx="13" cy="18" r="0.8" fill="#FFF9C4"/>
    <circle cx="18" cy="16" r="0.8" fill="#FFF9C4"/>
    <circle cx="10" cy="24" r="0.8" fill="#FFF9C4"/>
    <circle cx="16" cy="24" r="0.8" fill="#FFF9C4"/>
    <path d="M13 9 C10 4, 5 6, 4 10 C9 10, 11 11, 13 9 Z" fill="url(#mf_leaf)"/>
    <path d="M13 9 C14 4, 21 5, 22 10 C17 10, 14 11, 13 9 Z" fill="url(#mf_leaf)"/>
  </g>

  <!-- Étage 3 : Fraise Suprême au sommet couronnée -->
  <g transform="translate(23, 11) scale(0.88)">
    <!-- Queue -->
    <path d="M11 6 C11 3, 13 1, 15 0 C14 3, 13 5, 12 7 Z" fill="#388E3C"/>
    <!-- Corps -->
    <path d="M4 12 C1 21, 5 30, 13 33 C21 30, 25 21, 22 12 C19 7, 7 7, 4 12 Z" fill="url(#mf_red2)"/>
    <!-- Brillance -->
    <path d="M6 14 C4 18, 5 23, 7 25 C6 22, 5 19, 7 15 C8 12, 11 11, 13 10 C9 10, 7 12, 6 14 Z" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="9" cy="13" r="1.3" fill="#FFFFFF" opacity="0.7"/>
    <!-- Graines dorées -->
    <circle cx="8" cy="17" r="0.8" fill="#FFF9C4"/>
    <circle cx="13" cy="19" r="0.8" fill="#FFF9C4"/>
    <circle cx="18" cy="17" r="0.8" fill="#FFF9C4"/>
    <circle cx="10" cy="24" r="0.8" fill="#FFF9C4"/>
    <circle cx="16" cy="24" r="0.8" fill="#FFF9C4"/>
    <!-- Feuilles -->
    <path d="M13 9 C10 4, 5 6, 4 10 C9 10, 11 11, 13 9 Z" fill="url(#mf_leaf)"/>
    <path d="M13 9 C14 4, 21 5, 22 10 C17 10, 14 11, 13 9 Z" fill="url(#mf_leaf)"/>
  </g>

  <!-- Petite couronne dorée posée sur la fraise suprême -->
  <g transform="translate(27, 7)">
    <path d="M1 8 L3 2 L6 5 L9 1 L12 5 L15 2 L17 8 Z" fill="url(#mf_gold)" stroke="#E65100" stroke-width="0.8" stroke-linejoin="round"/>
    <circle cx="3" cy="2" r="1" fill="#FF1744"/>
    <circle cx="9" cy="1" r="1.2" fill="#2979FF"/>
    <circle cx="15" cy="2" r="1" fill="#00E676"/>
    <rect x="2" y="7" width="14" height="2" rx="0.5" fill="#FFB300"/>
  </g>

  <!-- Étincelles et poussière féerique dorée -->
  <path d="M52 13 C52 17, 54 19, 58 19 C54 19, 52 21, 52 25 C52 21, 50 19, 46 19 C50 19, 52 17, 52 13 Z" fill="#FFE082"/>
  <path d="M10 17 C10 20, 11 21, 13 21 C11 21, 10 22, 10 25 C10 22, 9 21, 7 21 C9 21, 10 20, 10 17 Z" fill="#FFE082"/>
  <circle cx="14" cy="48" r="1.5" fill="#FFF9C4"/>
  <circle cx="53" cy="47" r="1.5" fill="#FFF9C4"/>
  <circle cx="50" cy="32" r="1.2" fill="#FFE082"/>
  <circle cx="12" cy="30" r="1.2" fill="#FFE082"/>
</svg>

