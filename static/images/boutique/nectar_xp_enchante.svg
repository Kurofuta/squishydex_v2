<svg viewBox="0 0 64 64" width="60" height="60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradé du Nectar Féerique néon violet / cyan -->
    <linearGradient id="nec_liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <!-- Or enchanté céleste -->
    <linearGradient id="nec_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <!-- Verre diamanté -->
    <linearGradient id="nec_glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E0E7FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Orbe flottant céleste -->
    <linearGradient id="nec_orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  <!-- Ombre au sol -->
  <ellipse cx="32" cy="57" rx="22" ry="5" fill="#fbcfe8" opacity="0.9"/>

  <!-- Halo de lévitation et d'enchantement -->
  <circle cx="32" cy="37" r="22" fill="#38BDF8" opacity="0.18"/>
  <circle cx="32" cy="37" r="16" fill="#C084FC" opacity="0.25"/>

  <!-- === ANNEAU MAGIQUE EN LÉVITATION (ORBITE) === -->
  <ellipse cx="32" cy="37" rx="24" ry="7" transform="rotate(-15 32 37)" fill="none" stroke="#67E8F9" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.85"/>
  <ellipse cx="32" cy="37" rx="24" ry="7" transform="rotate(15 32 37)" fill="none" stroke="#F472B6" stroke-width="1" stroke-dasharray="4 2" opacity="0.7"/>

  <!-- Petite rune lumineuse sur l'orbite gauche -->
  <circle cx="10" cy="33" r="1.8" fill="#67E8F9"/>
  <!-- Petite rune sur l'orbite droite -->
  <circle cx="54" cy="41" r="1.8" fill="#F472B6"/>

  <!-- === FLACON DIAMANT ENCHANTÉ === -->
  <!-- Pied / socle orfévré -->
  <path d="M 23 52 C 26 55 38 55 41 52 L 38 49 L 26 49 Z" fill="url(#nec_gold)" stroke="#B45309" stroke-width="0.8"/>

  <!-- Corps géométrique du flacon diamant -->
  <polygon points="32,23 48,34 42,50 22,50 16,34" fill="url(#nec_glass)" stroke="#4338CA" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Remplissage du nectar magique lumineux -->
  <polygon points="32,30 46,36 41,49 23,49 18,36" fill="url(#nec_liquid)"/>
  <!-- Ligne de surface lumineuse et étincelante -->
  <line x1="18" y1="36" x2="46" y2="36" stroke="#E0F2FE" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Spirale de lumière céleste à l'intérieur du nectar -->
  <path d="M 24 45 C 27 40 37 40 40 45" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <circle cx="28" cy="41" r="1.5" fill="#FFFFFF"/>
  <circle cx="36" cy="43" r="1.8" fill="#67E8F9"/>
  <circle cx="32" cy="38" r="1.2" fill="#FFFFFF"/>

  <!-- Arêtes ciselées du diamant (reflets) -->
  <line x1="32" y1="23" x2="32" y2="49" stroke="#FFFFFF" stroke-width="1" opacity="0.65"/>
  <line x1="32" y1="23" x2="22" y2="50" stroke="#FFFFFF" stroke-width="0.8" opacity="0.5"/>
  <line x1="32" y1="23" x2="42" y2="50" stroke="#312E81" stroke-width="0.8" opacity="0.4"/>
  <path d="M 17 34 L 32 24" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Col doré ciselé -->
  <path d="M 28 23 L 28 17 L 36 17 L 36 23 Z" fill="url(#nec_gold)" stroke="#B45309" stroke-width="0.8"/>
  <ellipse cx="32" cy="17" rx="4.5" ry="1.5" fill="#FEF08A"/>

  <!-- Croissant de lune / Orbe enchanté flottant au-dessus -->
  <!-- Support d'orbe -->
  <path d="M 29 17 C 29 13 35 13 35 17" stroke="url(#nec_gold)" stroke-width="1.5" fill="none"/>
  <!-- Orbe céleste flottant -->
  <circle cx="32" cy="9" r="5" fill="url(#nec_orb)" stroke="#0891B2" stroke-width="0.8"/>
  <!-- Croissant de lumière sur l'orbe -->
  <path d="M 32 5 C 34 7 34 11 32 13 C 35 12 36 8 32 5 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- === ÉTINCELLES ÉPIQUES ET POUSSIÈRE D'ÉTOILES === -->
  <!-- Grande étoile haut gauche -->
  <path d="M 13 8 C 13 11.5 14.5 13.5 17.5 13.5 C 14.5 13.5 13 15.5 13 19 C 13 15.5 11.5 13.5 8.5 13.5 C 11.5 13.5 13 11.5 13 8 Z" fill="#67E8F9"/>
  <!-- Étoile haut droite -->
  <path d="M 50 14 C 50 16.5 51 18 53 18 C 51 18 50 19.5 50 22 C 50 19.5 49 18 47 18 C 49 18 50 16.5 50 14 Z" fill="#FDF4FF"/>
  <!-- Particules célestes -->
  <circle cx="16" cy="46" r="1.3" fill="#67E8F9"/>
  <circle cx="48" cy="48" r="1.4" fill="#F472B6"/>
  <circle cx="46" cy="26" r="1.2" fill="#FFFFFF"/>
</svg>

