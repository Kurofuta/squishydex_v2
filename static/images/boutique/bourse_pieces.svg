<svg viewBox="0 0 64 64" width="60" height="60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradés de la bourse en cuir chaleureux -->
    <linearGradient id="p3_sack_main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="35%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="p3_sack_light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="p3_rope" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <!-- Dégradés de l'or étincelant -->
    <linearGradient id="p3_gold_face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="40%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="p3_gold_edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>
    <linearGradient id="p3_gold_bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
  </defs>

  <!-- Ombre douce pastel au sol -->
  <ellipse cx="32" cy="57" rx="26" ry="5.5" fill="#fbcfe8" opacity="0.9"/>

  <!-- === PIÈCES ARRIÈRE DE L'OUVERTURE === -->
  <ellipse cx="26" cy="16" rx="5.5" ry="3.5" fill="url(#p3_gold_face)"/>
  <ellipse cx="38" cy="15" rx="5.5" ry="3.5" fill="url(#p3_gold_face)"/>
  <ellipse cx="32" cy="11" rx="7" ry="4.2" fill="url(#p3_gold_bright)"/>
  <ellipse cx="32" cy="11" rx="5.2" ry="2.8" fill="none" stroke="#FFFDE7" stroke-width="0.8"/>
  <circle cx="32" cy="11" r="1.3" fill="#FFFDE7"/>

  <!-- Col plissé ouvert de la bourse (arrière) -->
  <path d="M 21 24 C 18 19, 15 15, 17 12 C 20 15, 22 17, 24 16 C 26 13, 28 13, 30 14 C 33 13, 35 14, 38 13 C 40 16, 42 15, 44 12 C 46 15, 44 19, 43 24 Z" fill="#78350F"/>
  <path d="M 17 12 C 20 15, 22 17, 24 16 C 26 13, 28 13, 30 14 C 33 13, 35 14, 38 13 C 40 16, 42 15, 44 12 L 43 16 L 38 17 L 31 18 L 24 17 L 17 14 Z" fill="#92400E"/>

  <!-- === CORPS DODU DE LA BOURSE === -->
  <path d="M 23 25 C 10 31, 8 50, 22 54 C 27 55.5, 37 55.5, 42 54 C 56 50, 54 31, 41 25 Z" fill="url(#p3_sack_main)"/>
  <!-- Ombre sous le ventre du sac -->
  <path d="M 17 48 C 22 55, 42 55, 47 48 C 53 53, 37 56, 27 55 C 17 54, 13 51, 17 48 Z" fill="#78350F" opacity="0.45"/>
  <!-- Volume bombé lumineux sur le ventre -->
  <path d="M 24 30 C 15 36, 17 46, 24 49 C 30 50.5, 36 49, 39 46 C 45 40, 44 32, 38 29 Z" fill="url(#p3_sack_light)" opacity="0.38"/>

  <!-- Écusson / Médaillon doré avec étoile au centre de la bourse -->
  <circle cx="32" cy="42" r="6" fill="url(#p3_gold_edge)"/>
  <circle cx="32" cy="41.2" r="5.6" fill="url(#p3_gold_face)"/>
  <circle cx="32" cy="41.2" r="4.3" fill="none" stroke="#FFFDE7" stroke-width="0.8"/>
  <path d="M32 38.2 L32.7 40.2 L34.7 41.2 L32.7 42.2 L32 44.2 L31.3 42.2 L29.3 41.2 L31.3 40.2 Z" fill="#FFFDE7"/>

  <!-- === CORDON NOUÉ (ATTACHE) === -->
  <!-- Corde serrée autour du cou -->
  <path d="M 21 24 C 26 27.5, 38 27.5, 43 24 L 43 27 C 38 30.5, 26 30.5, 21 27 Z" fill="url(#p3_rope)"/>
  <path d="M 21 24 C 26 27.5, 38 27.5, 43 24" stroke="#713F12" stroke-width="0.8" fill="none"/>
  <!-- Nœud -->
  <circle cx="28" cy="27" r="2.3" fill="#EAB308" stroke="#854D0E" stroke-width="0.6"/>
  <!-- Cordeaux et pompons dorés qui pendent -->
  <path d="M 27 28 C 25 32, 23 35, 22 38" stroke="#CA8A04" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="22" cy="38" r="2.1" fill="#FBBF24" stroke="#854D0E" stroke-width="0.5"/>
  <path d="M 29 28 C 30 32, 31 35, 32 37.5" stroke="#CA8A04" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="32" cy="37.5" r="2.1" fill="#FBBF24" stroke="#854D0E" stroke-width="0.5"/>

  <!-- === PIÈCES D'OR QUI DÉBORDENT DU COL === -->
  <ellipse cx="25" cy="21" rx="5" ry="3.2" fill="url(#p3_gold_bright)"/>
  <ellipse cx="39" cy="20" rx="5" ry="3.2" fill="url(#p3_gold_bright)"/>
  <ellipse cx="32" cy="21" rx="5.5" ry="3.5" fill="url(#p3_gold_bright)"/>
  <ellipse cx="32" cy="21" rx="4" ry="2.2" fill="none" stroke="#FFFDE7" stroke-width="0.7"/>

  <!-- Pièce dorée qui glisse sur le côté droit du sac -->
  <g transform="translate(46, 33) rotate(32)">
    <ellipse cx="0" cy="1.2" rx="4.5" ry="4.5" fill="#BF360C"/>
    <ellipse cx="0" cy="0" rx="4.5" ry="4.5" fill="url(#p3_gold_bright)"/>
    <circle cx="0" cy="0" r="3.2" fill="none" stroke="#FFFDE7" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="1.2" fill="#FFFDE7"/>
  </g>

  <!-- === PIÈCES RÉPANDUES AU SOL === -->
  <!-- Côté gauche : petite pile et pièce penchée -->
  <path d="M 8 50 C 8 53, 18 53, 18 50 L 18 53 C 18 56, 8 56, 8 53 Z" fill="url(#p3_gold_edge)"/>
  <ellipse cx="13" cy="50" rx="5" ry="2.6" fill="url(#p3_gold_face)"/>
  <path d="M 8 47 C 8 50, 18 50, 18 47 L 18 49 C 18 52, 8 52, 8 49 Z" fill="url(#p3_gold_edge)"/>
  <ellipse cx="13" cy="47" rx="5" ry="2.6" fill="url(#p3_gold_bright)"/>
  <g transform="translate(18, 51) rotate(-22)">
    <ellipse cx="0" cy="1" rx="4.5" ry="4.5" fill="#BF360C"/>
    <ellipse cx="0" cy="0" rx="4.5" ry="4.5" fill="url(#p3_gold_bright)"/>
    <circle cx="0" cy="0" r="3.2" fill="none" stroke="#FFFDE7" stroke-width="0.7"/>
  </g>

  <!-- Côté droit : pile et pièces qui roulent -->
  <path d="M 45 50 C 45 53, 56 53, 56 50 L 56 53 C 56 56, 45 56, 45 53 Z" fill="url(#p3_gold_edge)"/>
  <ellipse cx="50.5" cy="50" rx="5.5" ry="2.8" fill="url(#p3_gold_face)"/>
  <path d="M 45 47 C 45 50, 56 50, 56 47 L 56 49 C 56 52, 45 52, 45 49 Z" fill="url(#p3_gold_edge)"/>
  <ellipse cx="50.5" cy="47" rx="5.5" ry="2.8" fill="url(#p3_gold_bright)"/>
  <ellipse cx="57" cy="53" rx="4" ry="2.2" transform="rotate(18 57 53)" fill="url(#p3_gold_face)"/>

  <!-- Pièce centrale au pied du sac -->
  <ellipse cx="32" cy="54.5" rx="5.5" ry="2.6" fill="url(#p3_gold_bright)"/>
  <ellipse cx="32" cy="54.5" rx="3.8" ry="1.6" fill="none" stroke="#FFFDE7" stroke-width="0.6"/>

  <!-- === ÉTINCELLES ÉCLATANTES (SPARKLES) === -->
  <!-- Sommet pièces -->
  <path d="M38 5 C38 8.5 39.5 10.5 42.5 10.5 C39.5 10.5 38 12.5 38 16 C38 12.5 36.5 10.5 33.5 10.5 C36.5 10.5 38 8.5 38 5 Z" fill="#FFFDE7"/>
  <!-- Gauche col -->
  <path d="M14 15 C14 17 15 18 17 18 C15 18 14 19 14 21 C14 19 13 18 11 18 C13 18 14 17 14 15 Z" fill="#FFFDE7"/>
  <!-- Écusson centre -->
  <path d="M38 38 C38 39.5 39 40.5 40.5 40.5 C39 40.5 38 41.5 38 43 C38 41.5 37 40.5 35.5 40.5 C37 40.5 38 39.5 38 38 Z" fill="#FFFDE7"/>
  <!-- Points lumineux -->
  <circle cx="21" cy="9" r="1.3" fill="#FFFDE7"/>
  <circle cx="51" cy="18" r="1.4" fill="#FFF9C4"/>
  <circle cx="58" cy="42" r="1.2" fill="#FFFDE7"/>
</svg>

